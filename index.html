<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#180b0e">
  <meta name="description" content="Расписание звонков, баллы и домашние задания.">
  <title>онлайн шлюшки — расписание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="assets/icons/sparkles.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="glow-orb orb-one"></span><span class="glow-orb orb-two"></span><span class="glow-orb orb-three"></span><span class="glow-orb orb-four"></span><span class="ambient-specks"></span></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Онлайн шлюшки — главная"><span class="brand-icon icon-mask" style="--icon:url('assets/icons/sparkles.svg')"></span><span>онлайн шлюшки</span></a>
      <div class="controls">
        <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Включить светлую тему" title="Сменить тему"><span id="themeIcon" class="icon-mask" style="--icon:url('assets/icons/sun.svg')"></span></button>
        <div class="accent-picker">
          <button id="accentToggle" class="color-control" type="button" aria-label="Выбрать цвет акцента" aria-expanded="false" aria-controls="accentPanel"><span class="accent-preview" id="accentPreview"></span><span class="color-label">ЦВЕТ</span><span class="accent-chevron icon-mask" style="--icon:url('assets/icons/chevron-down.svg')"></span></button>
          <div id="accentPanel" class="accent-panel" hidden aria-label="Выбор цвета акцента">
            <span class="palette-title">Выбери любой цвет</span>
            <div id="saturationField" class="saturation-field" role="slider" tabindex="0" aria-label="Насыщенность и яркость цвета" aria-valuemin="0" aria-valuemax="100"><span class="picker-handle"></span></div>
            <label class="hue-control"><span>ОТТЕНОК</span><input id="hueRange" type="range" min="0" max="360" value="350" aria-label="Оттенок"></label>
            <div class="color-preview-row"><span id="accentHex">#BD334C</span><span class="color-preview-chip" id="accentSample">Aa</span></div>
          </div>
        </div>
      </div>
    </header>

    <main id="home">
      <section class="home-screen">
        <section class="now-card" aria-live="polite" aria-label="Текущий статус расписания">
          <div class="now-top">
            <span id="statusIcon" class="now-icon icon-mask" style="--icon:url('assets/icons/clock-3.svg')"></span>
            <span class="now-kicker" id="statusKicker"></span>
            <button id="scheduleToggle" class="schedule-control" type="button" aria-expanded="false" aria-controls="scheduleFace"><span class="schedule-control-icon icon-mask" style="--icon:url('assets/icons/table-2.svg')"></span><span id="scheduleToggleText">Расписание</span><span id="expandIcon" class="expand-icon icon-mask" style="--icon:url('assets/icons/chevron-down.svg')"></span></button>
          </div>
          <div id="statusFace" class="status-face">
          <h1 id="statusTitle">Загружаем расписание</h1>
          <p class="status-description" id="statusDescription">—</p>
          <div class="time-range" id="timeRange"><div><span>НАЧАЛО</span><strong>—</strong></div><i></i><div><span>КОНЕЦ</span><strong>—</strong></div></div>
          <div class="countdown" id="countdown">—</div>
          </div>
          <div id="scheduleFace" class="schedule-face" aria-hidden="true"><div class="schedule-face-title"><span>ЗВОНКИ</span></div><div id="scheduleRows"></div></div>
        </section>
      </section>

      <section class="quick-links" aria-label="Быстрые ссылки">
        <a class="quick-link homework" href="https://cloud.mail.ru/public/ew3u/oiZwXzCVk/%D0%A0%D0%B0%D0%B7%D0%B4%D0%B5%D0%BB%202%20%D0%9A%D0%BE%D1%80%D0%BD%D0%B8%2C%20%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%2C%20log" target="_blank" rel="noopener noreferrer"><span class="link-icon"><span class="icon-mask" style="--icon:url('assets/icons/book-open-check.svg')"></span></span><span><strong>Боль в моя дырка задница</strong></span><span class="link-arrow icon-mask" style="--icon:url('assets/icons/arrow-up-right.svg')"></span></a>
      </section>

      <section id="grades" class="grades-card">
        <div class="grades-heading"><h2>Проверить оценки</h2></div>
        <form id="searchForm" class="search-form"><label class="sr-only" for="surnameInput">Фамилия</label><input id="surnameInput" type="search" placeholder="Фамилия" autocomplete="off" required><button type="submit">Найти <span>↗</span></button></form>
        <div id="result" class="result" aria-live="polite" hidden></div>
        <div id="dataState" class="data-state" hidden><span class="state-mark"></span><span></span><button id="retryData" type="button" hidden>Повторить</button></div>
        <div class="table-actions">
          <button id="tableToggle" class="table-toggle" type="button" aria-expanded="false" aria-controls="gradesTable"><span class="icon-mask" style="--icon:url('assets/icons/table-2.svg')"></span><span id="tableToggleText">Вся таблица</span><span class="icon-mask table-chevron" style="--icon:url('assets/icons/chevron-down.svg')"></span></button>
          <a class="source-table-link" href="https://docs.google.com/spreadsheets/d/1OiDT-mY-9lPxCguMSUqgCsm_Lr_p2G7RIYCRZpJ42Qo/edit?usp=sharing" target="_blank" rel="noopener noreferrer" aria-label="Открыть исходную таблицу Google Таблиц" title="Открыть Google Таблицу"><span class="source-table-icon" aria-hidden="true"></span></a>
        </div>
        <section id="gradesTable" class="grades-table" hidden aria-label="Таблица результатов группы">
          <div class="grades-table-inner">
            <div class="table-tools"><label class="sr-only" for="tableSearch">Поиск по фамилии</label><input id="tableSearch" type="search" placeholder="Поиск по фамилии"></div>
            <div class="table-head"><button id="nameSort" type="button" data-sort="name">Ученик <span class="sort-mark"></span></button><button id="scoreSort" type="button" data-sort="score">Баллы <span class="sort-mark"></span></button><button id="percentSort" type="button" data-sort="percent">% <span class="sort-mark"></span></button><button id="absenceSort" type="button" data-sort="absences">Н <span class="sort-mark"></span></button></div>
            <div id="tableRows" class="table-rows" role="table"></div>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
